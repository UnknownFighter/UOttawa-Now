name: Update events and deploy site

on:
  schedule:
    - cron: "17 */6 * * *"        # every 6 hours (the most frequent allowed for this project)
  workflow_dispatch:               # lets you press "Run workflow" by hand
  push:
    branches: [main]
    paths: ["site/**"]             # redeploy when you edit the website (no scraping on push)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract OCR (English + French)
        if: github.event_name != 'push'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra

      - name: Install Python packages
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Scrape, OCR, extract events
        if: github.event_name != 'push'
        env:                         # optional logged-in Instagram session (see README)
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
        run: python -m pipeline.run

      - name: Save new data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Update events data"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
