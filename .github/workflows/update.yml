name: Update events and deploy site

on:
  schedule:
    - cron: "17 11 * * *"          # once a day, 11:17 UTC (about 6:17 am Ottawa time)
  workflow_dispatch:               # lets you press "Run workflow" by hand
  push:
    branches: [main]
    paths: ["site/**"]             # redeploy when you edit the website (no scraping on push)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract OCR (English + French)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Scrape, OCR, extract events
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pipeline.run

      - name: Save new data to the repository
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          cp -r data /tmp/gen-data
          cp -r site/data /tmp/gen-site-data
          ok=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data site/data
            cp -r /tmp/gen-data data
            cp -r /tmp/gen-site-data site/data
            git add data site/data
            if git diff --cached --quiet; then echo "No data changes"; ok=1; break; fi
            git commit -m "Update events data"
            if git push origin HEAD:main; then ok=1; break; fi
            echo "Push rejected, retrying ($attempt)"; sleep 5
          done
          [ "$ok" = 1 ] || exit 1

  deploy:
    needs: scrape
    if: ${{ !cancelled() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # always the newest commit, including the data saved above
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        