# ============================================================
#  CONFIG - the only file you normally need to edit.
# ============================================================
timezone: America/Toronto
posts_per_run: 10        # posts fetched per account on each scheduled run
posts_first_run: 15      # posts fetched the very first time an account is scraped
missed_days: 7           # how long past events stay in the "Missed" tab
upcoming_days: 31        # how far ahead the site shows events

# Categories shown in the filter menu. 'religion' is hidden by default (handled in site/app.js).
categories:
  - {id: sports,     en: Sports,     fr: Sports}
  - {id: food,       en: Food,       fr: Nourriture}
  - {id: networking, en: Networking, fr: Réseautage}
  - {id: academic,   en: Academic,   fr: Études}
  - {id: culture,    en: Culture,    fr: Culture}
  - {id: social,     en: Social,     fr: Social}
  - {id: religion,   en: Religion,   fr: Religion}
  - {id: other,      en: Other,      fr: Autre}

# ------------------------------------------------------------
#  ACCOUNTS. To add one, copy a line and change the handle.
#  handle   = account name without the @
#  category = one of the ids above (my best guess - PLEASE CHECK each one)
#  name_en/name_fr = FULL club name in each language (TODO: fill in)
#  acronym_en/acronym_fr = club acronym in each language (TODO: fill in)
#  Until filled in, the site shows "@handle" as the club name.
# ------------------------------------------------------------
accounts:
  instagram:
    - {handle: uo.ebc,                    category: networking, name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: mtlbsauo,                  category: culture,    name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: rwsa.uottawa,              category: culture,    name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: nsbeuottawa,               category: networking, name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: uossa.aesuo,               category: culture,    name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: maison_i_house,            category: culture,    name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: ieeeuottawa,               category: networking, name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: uottawa_essaeg,            category: academic,   name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: genie_engineering_uottawa, category: academic,   name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: uomsa.aemuo,               category: religion,   name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: aeeippssa.uo,              category: academic,   name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: food_bank_aliment,         category: food,       name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: uo.bsa,                    category: culture,    name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: uo_ysa,                    category: culture,    name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: tsa.uottawa,               category: culture,    name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
    - {handle: uottawa.susa, category: culture, name_en: "Sudanese Students Association", name_fr: "Association des étudiants soudanais", acronym_en: "SUSA", acronym_fr: "AÉS"}

  # >>> TIKTOK ACCOUNTS GO HERE (same format as above). Example:
  # tiktok:
  #   - {handle: some_club, category: sports, name_en: "", name_fr: "", acronym_en: "", acronym_fr: ""}
  tiktok: []

# ------------------------------------------------------------
#  Term dates. The pipeline tries to read them from the uOttawa page twice a year.
#  If that fails (page layout changed), fill in 'override' - it always wins.
#  Without either, it falls back to: Fall Sep 1-Dec 31, Winter Jan 1-Apr 30, Summer May 1-Aug 31.
# ------------------------------------------------------------
terms:
  url: https://www.uottawa.ca/study/important-academic-dates-deadlines
  override: {}
  # override example (uncomment and edit):
  # override:
  #   fall:   {start: "2026-09-02", end: "2026-12-18"}
  #   winter: {start: "2027-01-11", end: "2027-04-30"}
  #   summer: {start: "2027-05-01", end: "2027-08-20"}
